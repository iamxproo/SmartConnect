# SmartConnect — Redis 7 configuration (local development).
#
# Redis is used for caching, ephemeral coordination (presence, rate limits, locks) and
# WebSocket fan-out. It is NOT the durable event source: durable events live in each
# service's PostgreSQL outbox table (see docs/database/architecture.md).
#
# The password is injected at start-up from a Docker secret by entrypoint.sh.
# Never put credentials in this file.

bind * -::*
protected-mode yes
port 6379
dir /data

# --- Durability: AOF fsync'd every second, RDB preamble for fast restarts ---
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 3600 1 300 100 60 10000

# --- Memory: bounded so Redis can never starve the 8 GB development machine ---
# volatile-lru only evicts keys that carry a TTL. Convention: every cache key MUST have a TTL;
# coordination keys without a TTL are never evicted (writes fail loudly instead).
maxmemory 256mb
maxmemory-policy volatile-lru

# --- Operations ---
tcp-keepalive 60
timeout 0
loglevel notice
latency-monitor-threshold 100
