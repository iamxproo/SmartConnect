name: Feature request
description: Propose new functionality or a change in behaviour.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area(s)
      multiple: true
      options:
        - Frontend: web
        - Frontend: mobile
        - Backend service
        - API gateway
        - Database / migrations
        - Infrastructure
        - CI / tooling
  - type: textarea
    id: data
    attributes:
      label: Data, tenancy and security considerations
      description: New data stored? Which service owns it? Personal data? Cross-tenant access? Retention?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
